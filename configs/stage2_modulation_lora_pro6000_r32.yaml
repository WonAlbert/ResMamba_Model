stage: stage2
task: modulation
pool: downstream_modulation_train
val_pool: downstream_modulation_val
iq_normalize: joint_power
dataset_balanced_sampling: true
balanced_sampling_strategy: length_bucket
selection_metric: f1
early_stopping_patience: 12
val_subset_fraction: 0.5
val_subset_seed: 42
val_subset_resample_each_epoch: true
gradient_accumulation_steps: 1
warmup_steps: 1500
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
lr_scale_with_grad_accum: true
num_workers: 20
prefetch_factor: 4
peft_mode: lora_task_path
lora_rank: 32
lora_alpha: 64.0
lora_dropout: 0.03
freeze_backbone: true
unfreeze_modulation_backbone: true
unfreeze_emitter_backbone: false
learning_rate: 0.00005
batch_size: 256
epochs: 60

stage: stage2
task: emitter
pool: downstream_emitter_train
val_pool: downstream_emitter_val
emitter_downstream_datasets:
  - adsb2
  - wifi150
  - radar_emitters
iq_normalize: joint_power
dataset_balanced_sampling: true
# PK 采样：同长度桶内 P 类 × K 样本/类，保证 batch 内同类正对
balanced_sampling_strategy: length_bucket_pk
pk_num_classes: 64
pk_samples_per_class: 8
selection_metric: per_dataset_macro_acc
early_stopping_patience: 20
val_subset_fraction: 0.5
val_subset_seed: 42
val_subset_resample_each_epoch: true
gradient_accumulation_steps: 1
warmup_steps: 300
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
lr_scale_with_grad_accum: true
num_workers: 20
prefetch_factor: 4
peft_mode: task_path
amp_dtype: bfloat16
freeze_backbone: true
unfreeze_modulation_backbone: false
unfreeze_emitter_backbone: true
# 加强监督对比（PK batch 内每类 K=8 正对）
emitter_contrastive_weight: 0.5
# 续训二阶段：base_lr 5e-5 × accum 1 → peak_lr 5e-5
learning_rate: 0.00005
batch_size: 512
epochs: 150
# 二阶段续训：按剩余 epoch 重建 cosine，并重新 warmup（勿沿用旧 completed_steps）
reset_lr_schedule_on_resume: true

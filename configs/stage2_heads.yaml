stage: stage2
# 划分：*_train.h5 仅预训练；*_val.h5 各阶段验证；*_test.h5 下游/微调训练（经 *_train pool，不作评测）
# communication_emitters 见 configs/excluded_datasets.yaml，已从所有 task pool 排除
# xidian14 见 configs/downstream_excluded_datasets.yaml，仅预训练保留
# open_real_data / electromagnetic_0926 见 configs/downstream_modulation_extra_datasets.yaml
iq_normalize: joint_power
dataset_balanced_sampling: true
balanced_sampling_strategy: length_bucket
# 各任务采样覆盖（emitter 见 configs/stage2_emitter.yaml）
task_configs:
  modulation:
    # 同长度组 batch，避免 dataset 采样长短混 pad 引发数值不稳；仅解冻 mod 路径
    balanced_sampling_strategy: length_bucket
    unfreeze_modulation_backbone: true
    unfreeze_emitter_backbone: false
    learning_rate: 0.00005
  prediction:
    # 同 I/Q 长度组 batch；桶间等权、桶内子 H5 等权，小域（radar 等）不被大集稀释
    balanced_sampling_strategy: length_bucket
    val_subset_fraction: 0.05
    val_subset_max_per_dataset: 800
    val_length_bucket_batching: true
  clustering:
    # 跨域对比：各子数据集等权
    balanced_sampling_strategy: dataset
gradient_accumulation_steps: 4
warmup_steps: 1000
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
lr_scale_with_grad_accum: true
tasks:
  - modulation
  - emitter
  - prediction
  - clustering
freeze_backbone: true
# 可选 PEFT 策略：head_only | task_path | lora_task_path | full_backbone
# 默认 task_path，与历史 stage2 行为一致
peft_mode: task_path
# lora_task_path 专用
lora_rank: 8
lora_alpha: 16.0
lora_dropout: 0.05
# 默认不解冻任务路径；各 task_configs / 专用 YAML 按需开启
unfreeze_modulation_backbone: false
unfreeze_emitter_backbone: false
# stage2 emitter 辅助对比损失权重，0 表示关闭
emitter_contrastive_weight: 0.25
# best.pt / 早停选模指标：auto 时 modulation→f1, clustering→nmi, prediction→ssim, emitter→per_dataset_macro_acc
selection_metric: auto
learning_rate: 0.0001
batch_size: 64

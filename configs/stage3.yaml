# 阶段三：单任务 Hybrid-LoRA+ + TaskAdapter + 该任务头
model_config: configs/model.yaml
rfdata_root: /root/autodl-tmp/ResMamba_Signal_Model/dataset
iq_normalize: none
sequence_packing: true
encoder_pool_type: attn_pool
model:
  encoder_pool_type: attn_pool
mix_strategy: token_share
combine_then_pack: false
homogeneous_batch: true
balanced_sampling: false
balanced_sampling_strategy: length_bucket
token_budget: 4096
steps_per_epoch: 200
val_batches: 50
val_seed: 0
seed: 0
check_val_every_n_epoch: 1
min_ratio: 0.05
synthetic: false
amp: true
amp_dtype: bfloat16
epochs: 5
checkpoint_monitor: val/monitor
checkpoint_mode: min
early_stopping_patience: 3
num_workers: 4
max_grad_norm: 1.0
learning_rate: 2.0e-4
heads_lr: 5.0e-5
warmup_steps: 50
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
token_normalized_loss: true
lambda_recon: 0.0
use_dataset_bias: false
train_encoder: false
train_decoder: false
train_heads: true
skip_recon: true
compact_task_labels: true
loraplus_lr_ratio: 16
r_attn: 16
r_mamba: 8
lora_alpha_attn: 16
lora_alpha_mamba: 8
ssm_cotrain_dt_bias: false
peft:
  r_attn: 16
  r_mamba: 8
  lora_alpha_attn: 16
  lora_alpha_mamba: 8
  loraplus_lr_ratio: 16
  ssm_cotrain_dt_bias: false
  shared_lora: false
loss_weights:
  physical: 0.0
  domain: 0.0
tasks:
  - ld_intrapulse
  - ld_model
  - tx_modulation
  - ld_clustering
  - tx_clustering
  - prediction
task_pools:
  ld_intrapulse: [downstream_radar_modulation_train, downstream_radar_modulation_val]
  ld_model: [downstream_radar_model_train, downstream_radar_model_val]
  tx_modulation: [downstream_comm_modulation_train, downstream_comm_modulation_val]
  ld_clustering: [clustering_radar_train, clustering_radar_val]
  tx_clustering: [clustering_comm_train, clustering_comm_val]
  prediction: [prediction_train, prediction_val]
profiles:
  tiny:
    model_config: configs/model_tiny.yaml
    synthetic: true
    epochs: 1
    token_budget: 256
    steps_per_epoch: 2
    limit_train_batches: 2
    limit_val_batches: 1
    val_batches: 1
    num_workers: 0
    warmup_steps: 1
    learning_rate: 2.0e-4
    heads_lr: 1.0e-4
    r_attn: 4
    r_mamba: 2
    peft:
      r_attn: 4
      r_mamba: 2
      lora_alpha_attn: 4
      lora_alpha_mamba: 2
      loraplus_lr_ratio: 16
    require_mamba_kernel: false
    compact_task_labels: false
  ld_intrapulse:
    task: ld_intrapulse
    checkpoint_monitor: val/f1_ld_intrapulse
    checkpoint_mode: max
  ld_model:
    task: ld_model
    checkpoint_monitor: val/acc_ld_model
    checkpoint_mode: max
  tx_modulation:
    task: tx_modulation
    checkpoint_monitor: val/f1_tx_modulation
    checkpoint_mode: max
  ld_clustering:
    task: ld_clustering
    checkpoint_monitor: val/nmi_within_domain
    checkpoint_mode: max
  tx_clustering:
    task: tx_clustering
    checkpoint_monitor: val/nmi_within_domain
    checkpoint_mode: max
  prediction:
    task: prediction
    checkpoint_monitor: val/mse_prediction
    checkpoint_mode: min

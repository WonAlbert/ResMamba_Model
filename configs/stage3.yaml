# 阶段三：单任务 Hybrid-LoRA+ + TaskAdapter + 该任务头
# 数据与吞吐对齐 stage2；PEFT / 学习率保持本阶段配方
model_config: configs/model.yaml
rfdata_root: /root/autodl-tmp/ResMamba_Signal_Model/dataset
iq_normalize: none
skip_revin: true
sequence_packing: true
mix_strategy: token_share
combine_then_pack: false
homogeneous_batch: true
balanced_sampling: false
balanced_sampling_strategy: length_bucket
token_budget: 8192
steps_per_epoch: 600
val_batches: 50
val_seed: 0
seed: 0
check_val_every_n_epoch: 2
min_ratio: 0.05
synthetic: false
amp: true
amp_dtype: bfloat16
epochs: 20
checkpoint_monitor: val/monitor
checkpoint_mode: min
save_last: true
early_stopping_patience: 8
early_stopping_min_delta: 0.001
num_workers: 20
prefetch_factor: 4
cache_iq_in_memory: auto
max_grad_norm: 1.0
learning_rate: 2.0e-4
heads_lr: 5.0e-5
warmup_steps: 200
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
token_normalized_loss: true
clustering_view2: true
cluster_utilization_weight: 0.0
cluster_balance_mix: 0.0
cluster_sinkhorn_epsilon: 0.1
cluster_consistency_weight: 1.0
supervised_clustering: true
lambda_recon: 0.0
use_dataset_bias: false
# 关闭低秩原型头：用完整 residual MLP + 高维 Cosine（覆盖 model.yaml）
low_rank_prototype: false
train_encoder: false
train_decoder: false
train_heads: true
skip_recon: true
compact_task_labels: true
loraplus_lr_ratio: 16
r_attn: 16
r_mamba: 8
lora_alpha_attn: 16
lora_alpha_mamba: 8
ssm_cotrain_dt_bias: false
peft:
  r_attn: 16
  r_mamba: 8
  lora_alpha_attn: 16
  lora_alpha_mamba: 8
  loraplus_lr_ratio: 16
  ssm_cotrain_dt_bias: false
  shared_lora: false
loss_weights:
  physical: 0.0
  domain: 0.0
tasks:
  - ld_intrapulse
  - ld_model
  - tx_modulation
  - ld_clustering
  - tx_clustering
  - prediction
task_pools:
  ld_intrapulse: [downstream_radar_modulation_train, downstream_radar_modulation_val]
  ld_model: [downstream_radar_model_train, downstream_radar_model_val]
  tx_modulation: [downstream_comm_modulation_train, downstream_comm_modulation_val]
  ld_clustering: [clustering_radar_train, clustering_radar_val]
  tx_clustering: [clustering_comm_train, clustering_comm_val]
  prediction: [downstream_prediction_train, downstream_prediction_val]
profiles:
  # 六任务串行总墙钟 ~8–10h（目标≤12h）：对齐 stage2 加速项 + 略提 LR 促收敛
  disc_fast:
    steps_per_epoch: 400
    epochs: 14
    val_batches: 24
    check_val_every_n_epoch: 2
    early_stopping_patience: 5
    num_workers: 12
    cache_iq_in_memory: true
    clustering_view2: false
    learning_rate: 3.0e-4
    heads_lr: 8.0e-5
    warmup_steps: 80
  tiny:
    model_config: configs/model_tiny.yaml
    synthetic: true
    epochs: 1
    token_budget: 256
    steps_per_epoch: 2
    limit_train_batches: 2
    limit_val_batches: 1
    val_batches: 1
    num_workers: 0
    warmup_steps: 1
    learning_rate: 2.0e-4
    heads_lr: 1.0e-4
    r_attn: 4
    r_mamba: 2
    peft:
      r_attn: 4
      r_mamba: 2
      lora_alpha_attn: 4
      lora_alpha_mamba: 2
      loraplus_lr_ratio: 16
    require_mamba_kernel: false
    compact_task_labels: false
  ld_intrapulse:
    task: ld_intrapulse
    checkpoint_monitor: val/f1_ld_intrapulse
    checkpoint_mode: max
  ld_model:
    task: ld_model
    checkpoint_monitor: val/acc_ld_model
    checkpoint_mode: max
  tx_modulation:
    task: tx_modulation
    checkpoint_monitor: val/f1_tx_modulation
    checkpoint_mode: max
  ld_clustering:
    task: ld_clustering
    checkpoint_monitor: val/nmi_ld_clustering
    checkpoint_mode: max
  tx_clustering:
    task: tx_clustering
    checkpoint_monitor: val/nmi_tx_clustering
    checkpoint_mode: max
  prediction:
    task: prediction
    checkpoint_monitor: val/mse_prediction
    checkpoint_mode: min
    epochs: 30
    # 与 stage2 对齐：token MLP 头 + encode 目标位；避免 decoder-only 路径 TaskAdapter 无梯度
    use_legacy_generation_heads: true
    skip_recon: true
    heads_lr: 8.0e-5

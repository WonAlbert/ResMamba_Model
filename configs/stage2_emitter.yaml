stage: stage2
task: emitter
# 个体识别下游：训练 pool 读取 *_test.h5，验证 pool 读取 *_val.h5
pool: downstream_emitter_train
val_pool: downstream_emitter_val
emitter_downstream_datasets:
  - adsb2
  - wifi150
  - radar_emitters
iq_normalize: joint_power
# 同长度组 batch；桶间按类别数加权（100:150:10），避免 radar 过采样
dataset_balanced_sampling: true
balanced_sampling_strategy: length_bucket_class
selection_metric: per_dataset_macro_acc
early_stopping_patience: 8
# 每 epoch 验证：各子数据集内按类别均匀抽取 20%（每类 ceil(20%×N)，至少 1 条）
val_subset_fraction: 0.2
val_subset_seed: 42
val_subset_resample_each_epoch: true
gradient_accumulation_steps: 4
warmup_steps: 1000
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
lr_scale_with_grad_accum: true
freeze_backbone: true
unfreeze_modulation_backbone: false
unfreeze_emitter_backbone: true
emitter_contrastive_weight: 0.25
learning_rate: 0.0001
batch_size: 64
epochs: 30

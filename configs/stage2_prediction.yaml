stage: stage2
task: prediction
pool: downstream_prediction_train
val_pool: downstream_prediction_val
iq_normalize: joint_power
dataset_balanced_sampling: true
balanced_sampling_strategy: length_bucket
gradient_accumulation_steps: 4
warmup_steps: 1000
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
lr_scale_with_grad_accum: true
freeze_backbone: true
selection_metric: ssim
# 验证：先按类抽 5%，再每子 H5 上限 800 条；按信号长度分桶组 batch（避免长短混 pad）
val_subset_fraction: 0.05
val_subset_max_per_dataset: 800
val_subset_seed: 42
val_subset_resample_each_epoch: true
val_length_bucket_batching: true
learning_rate: 0.0001
batch_size: 64
epochs: 10
early_stopping_patience: 5

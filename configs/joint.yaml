# 阶段三 3b：联合训练 SharedTaskAdapter + tokenizer 尾部 + 全部 LoRA/头，合成一份 best.ckpt
model_config: configs/model.yaml
rfdata_root: /root/autodl-tmp/ResMamba_Signal_Model/dataset
iq_normalize: none
sequence_packing: true
mix_strategy: token_share
combine_then_pack: false
homogeneous_batch: true
balanced_sampling: false
balanced_sampling_strategy: length_bucket
token_budget: 4096
steps_per_epoch: 200
val_batches: 50
val_seed: 0
seed: 0
check_val_every_n_epoch: 1
min_ratio: 0.05
synthetic: false
amp: true
amp_dtype: bfloat16
epochs: 5
checkpoint_monitor: val/specialist_geomean
checkpoint_mode: max
early_stopping_patience: 3
num_workers: 4
max_grad_norm: 1.0
learning_rate: 2.0e-4
heads_lr: 5.0e-5
tokenizer_last_lr_scale: 0.1
warmup_steps: 50
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
token_normalized_loss: true
clustering_view2: true
distill_weight: 0.0
prototype_anchor_weight: 0.0
absorb_unknown: false
lambda_recon: 0.0
modulation_contrastive_weight: 0.25
emitter_contrastive_weight: 0.25
supervised_clustering: false
cluster_utilization_weight: 0.15
cluster_balance_mix: 0.7
cluster_sinkhorn_epsilon: 0.1
cluster_consistency_weight: 1.0
use_dataset_bias: false
train_encoder: false
train_decoder: false
train_heads: true
skip_recon: true
# 与阶段二/三一致：调制/个体用下游紧凑标签
compact_task_labels: true
unfreeze_tokenizer_last: true
loraplus_lr_ratio: 16
r_attn: 16
r_mamba: 8
shared_lora: true
ssm_cotrain_dt_bias: false
peft:
  r_attn: 16
  r_mamba: 8
  lora_alpha_attn: 16
  lora_alpha_mamba: 8
  loraplus_lr_ratio: 16
  ssm_cotrain_dt_bias: false
  shared_lora: true
loss_weights:
  physical: 0.0
  domain: 0.0
tasks:
  - modulation
  - emitter
  - clustering
  - prediction
  - imputation
task_pools:
  classification: [downstream_modulation_train, downstream_modulation_val]
  emitter: [downstream_emitter_train, downstream_emitter_val]
  clustering: [clustering_train, clustering_val]
  prediction: [downstream_prediction_train, downstream_prediction_val]
  imputation: [downstream_prediction_train, downstream_prediction_val]
profiles:
  tiny:
    model_config: configs/model_tiny.yaml
    synthetic: true
    epochs: 1
    token_budget: 256
    steps_per_epoch: 2
    limit_train_batches: 2
    limit_val_batches: 1
    val_batches: 1
    num_workers: 0
    warmup_steps: 1
    learning_rate: 2.0e-4
    heads_lr: 1.0e-4
    checkpoint_monitor: val/specialist_geomean
    checkpoint_mode: max
    r_attn: 4
    r_mamba: 2
    peft:
      r_attn: 4
      r_mamba: 2
      lora_alpha_attn: 4
      lora_alpha_mamba: 2
      loraplus_lr_ratio: 16
      shared_lora: true
    require_mamba_kernel: false

# 数据集 pool 过滤与白名单（原 excluded / downstream / emitter 四个文件合并）
# 各 loader 按 section 名读取 datasets 列表

excluded:
  # 从所有 task pool（含预训练、下游、预测、聚类）中排除
  datasets:
    - communication_emitters

pretrain:
  # MAE 预训练：仅使用下列数据集的 *_train.h5
  datasets:
    - electromagnetic_0926
    - open_real_data
    - radar_emitters
    - xidian14
    - panoradio_hf
    - radcom_awgn
    - radcom_dynamic
    - radcom_ota
    - cjr_mix

downstream_modulation:
  # 调制识别（非个体识别）下游：*_train.h5 训练，对应 *_val.h5 验证
  # 阶段二/三暂不用 RML2018（预测/聚类/插补 shared pool 随之去掉）
  datasets:
    - rml2016_04c
    - rml2016_10a
    - rml2016_10b
    # - rml2018_1a

emitter_downstream:
  # 个体识别下游微调；WiSig 为主基准，ADSB2 作跨域补充
  datasets:
    - wisig
    - adsb2

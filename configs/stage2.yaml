# 阶段二：冻结骨干 + 截断反传，训 UTI + 五头，并训 z_enc（encoder 池化）线性探针
# 主验收看 UTI 头；通用表征另报 val/acc_modulation_z / val/acc_emitter_z（encoder）
# 生成任务走 Prediction/ImputationHead，不解冻 decoder / adapters
# 默认按任务顺序训（每阶段独占 token_budget）；该阶段 train/val 都只跑当前任务
model_config: configs/model.yaml
rfdata_root: /root/autodl-tmp/ResMamba_Signal_Model/dataset
iq_normalize: none
sequence_packing: true
mix_strategy: token_share
combine_then_pack: true
balanced_sampling: false
balanced_sampling_strategy: length_bucket
token_budget: 12288
steps_per_epoch: 1000
val_batches: 50
val_seed: 0
seed: 0
check_val_every_n_epoch: 1
min_ratio: 0.05
synthetic: false
amp: true
amp_dtype: bfloat16
epochs: 20
checkpoint_monitor: val/multitask_geomean
checkpoint_mode: max
# 顺序训时关闭 early stop，避免前序任务阶段误杀后续 emitter/聚类
early_stopping_patience: 0
num_workers: 20
prefetch_factor: 4
cache_iq_in_memory: auto
max_grad_norm: 1.0
learning_rate: 1.0e-3
warmup_steps: 500
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
token_normalized_loss: true
clustering_view2: true
distill_weight: 0.0
distill_temperature: 2.0
distill_confidence: 0.5
prototype_anchor_weight: 0.0
# 顺序训防遗忘：后序阶段混入前序任务 exemplar + UTI pooled 特征蒸馏
replay_strategy: class_center
replay_mix_ratio: 0.15
# 单任务基线：每类 exemplar 数；总库容 = replay_samples_per_class * replay_baseline_classes_per_task
replay_samples_per_class: 20
replay_baseline_classes_per_task: 11
# 0=按上式自动；>0 则固定总 exemplar 上限，随 replay 任务数增加而减少每类样本
replay_memory_total_exemplars: 0
replay_scan_max_samples: 4096
replay_scan_token_budget: 2048
uti_replay_weight: 0.25
absorb_unknown: false
lambda_recon: 0.0
modulation_contrastive_weight: 0.05
emitter_contrastive_weight: 0.05
z_probe_weight: 0.2
supervised_clustering: false
# 抑制无监督过分割：少用强制均摊，降低 utilization
cluster_utilization_weight: 0.02
cluster_balance_mix: 0.35
cluster_sinkhorn_epsilon: 0.1
cluster_consistency_weight: 1.0
use_dataset_bias: false
train_encoder: false
train_decoder: false
train_heads: true
truncate_backward: true
skip_recon: true
loss_weights:
  physical: 0.0
  domain: 0.0
tasks:
  - modulation
  - emitter
  - clustering
  - prediction
  - imputation
# 按任务顺序：调制 → 个体（加长）→ 聚类 → 预测 → 插补；总 epochs 由各段相加覆盖上方 epochs
task_schedule:
  - task: modulation
    epochs: 20
  - task: emitter
    epochs: 15
  - task: clustering
    epochs: 5
  - task: prediction
    epochs: 5
  - task: imputation
    epochs: 5
# 单任务段结束后联合训练已完成任务（仅当已完成任务>=2；train+val 多源混训，不走 replay）
task_joint_epochs: 1
# 增加任务示例：
# - name: sonar
#   kind: classification
#   source: sonar
#   num_classes: 16
# task_kinds:
#   sonar: classification
task_pools:
  classification: [downstream_modulation_train, downstream_modulation_val]
  emitter: [downstream_emitter_train, downstream_emitter_val]
  clustering: [clustering_train, clustering_val]
  prediction: [downstream_prediction_train, downstream_prediction_val]
  imputation: [downstream_prediction_train, downstream_prediction_val]
profiles:
  tiny:
    model_config: configs/model_tiny.yaml
    synthetic: true
    epochs: 1
    token_budget: 256
    steps_per_epoch: 2
    limit_train_batches: 2
    limit_val_batches: 1
    val_batches: 1
    num_workers: 0
    warmup_steps: 1
    learning_rate: 1.0e-3
    require_mamba_kernel: false
    task_joint_epochs: 1
    task_schedule:
      - task: modulation
        epochs: 1
      - task: emitter
        epochs: 1

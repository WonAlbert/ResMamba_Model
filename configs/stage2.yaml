# 阶段二：冻结骨干 + 截断反传，只训当前任务头（+ 可选 z_enc 线性探针）
model_config: configs/model.yaml
rfdata_root: /root/autodl-tmp/ResMamba_Signal_Model/dataset
iq_normalize: none
sequence_packing: true
mix_strategy: token_share
combine_then_pack: false
homogeneous_batch: true
balanced_sampling: false
balanced_sampling_strategy: length_bucket
token_budget: 12288
steps_per_epoch: 1000
val_batches: 50
val_seed: 0
seed: 0
check_val_every_n_epoch: 1
min_ratio: 0.05
synthetic: false
amp: true
amp_dtype: bfloat16
epochs: 20
checkpoint_monitor: val/multitask_geomean
checkpoint_mode: max
early_stopping_patience: 0
num_workers: 20
prefetch_factor: 4
cache_iq_in_memory: auto
max_grad_norm: 1.0
learning_rate: 1.0e-3
warmup_steps: 500
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
token_normalized_loss: true
clustering_view2: true
distill_weight: 0.0
prototype_anchor_weight: 0.0
replay_strategy: class_center
replay_mix_ratio: 0.0
replay_samples_per_class: 20
replay_baseline_classes_per_task: 11
replay_memory_total_exemplars: 0
replay_scan_max_samples: 4096
replay_scan_token_budget: 2048
uti_replay_weight: 0.0
absorb_unknown: false
lambda_recon: 0.0
z_probe_weight: 0.5
z_contrastive_weight: 0.1
supervised_clustering: false
cluster_utilization_weight: 0.15
cluster_balance_mix: 0.7
cluster_sinkhorn_epsilon: 0.1
cluster_consistency_weight: 1.0
use_dataset_bias: false
train_encoder: false
train_decoder: false
train_heads: true
truncate_backward: true
skip_recon: true
compact_task_labels: true
loss_weights:
  physical: 0.0
  domain: 0.0
tasks:
  - ld_intrapulse
  - ld_model
  - tx_modulation
  - ld_clustering
  - tx_clustering
  - prediction
task_schedule:
  - task: ld_intrapulse
    epochs: 15
  - task: ld_model
    epochs: 15
  - task: tx_modulation
    epochs: 20
  - task: ld_clustering
    epochs: 15
  - task: tx_clustering
    epochs: 15
  - task: prediction
    epochs: 5
task_joint_epochs: 0
task_pools:
  ld_intrapulse: [downstream_radar_modulation_train, downstream_radar_modulation_val]
  ld_model: [downstream_radar_model_train, downstream_radar_model_val]
  tx_modulation: [downstream_comm_modulation_train, downstream_comm_modulation_val]
  ld_clustering: [clustering_radar_train, clustering_radar_val]
  tx_clustering: [clustering_comm_train, clustering_comm_val]
  prediction: [prediction_train, prediction_val]
profiles:
  tiny:
    model_config: configs/model_tiny.yaml
    synthetic: true
    epochs: 1
    token_budget: 256
    steps_per_epoch: 2
    limit_train_batches: 2
    limit_val_batches: 1
    val_batches: 1
    num_workers: 0
    warmup_steps: 1
    learning_rate: 1.0e-3
    require_mamba_kernel: false
    compact_task_labels: false
    task_joint_epochs: 0
    task_schedule:
      - task: ld_intrapulse
        epochs: 1
      - task: tx_modulation
        epochs: 1

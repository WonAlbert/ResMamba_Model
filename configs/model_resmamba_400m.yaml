# 约 0.3B 预训练骨干（文件名保留 400m 以兼容既有 checkpoint 路径）
model:
  d_model: 640
  encoder_layers: 14
  decoder_layers: 2
  space_layers: 2
  mamba_d_state: 64
  mamba_d_conv: 4
  mamba_expand: 2
  mamba_headdim: 64
  mamba_ngroups: 1
  mamba_chunk_size: 256
  dropout: 0.1
  patch_size: 8
  mask_ratio: 0.6
  max_tokens: 512
  num_datasets: 32
  num_mod_classes: 256
  num_emitters: 512
  num_prototypes: 256

# 预训练：重建 / 物理 / 插补 / 读出 / 域对抗；无分类 CE
model_config: configs/model.yaml
rfdata_root: /root/autodl-tmp/ResMamba_Signal_Model/dataset
pool: pretrain_train
cache_iq_in_memory: true
val_pool: pretrain_val
iq_normalize: none
sequence_packing: true
mix_strategy: token_share
mix_value_clip: 2.0
combine_then_pack: false
homogeneous_batch: true
balanced_sampling: false
balanced_sampling_strategy: length_bucket
token_budget: 8192
steps_per_epoch: 600
val_batches: 50
val_seed: 0
seed: 0
check_val_every_n_epoch: 1
checkpoint_monitor: val/monitor
checkpoint_mode: min
early_stopping_patience: 10
early_stopping_min_delta: 0.001
min_ratio: 0.05
synthetic: false
amp: true
amp_dtype: bfloat16
epochs: 50
num_workers: 20
prefetch_factor: 8
max_grad_norm: 0.5
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
warmup_steps: 500
lr_schedule: warmup_cosine
lr_min_ratio: 0.1
lr_scale_with_grad_accum: true
token_normalized_loss: true
p_trunc: 0.3
l_min: 16
chunk_len: 8192
vicreg_gamma: l2_unit
vicreg_gamma_token: 1.0
loss_weights:
  mae: 1.0
  physical: 0.2
  impute: 0.2
  readout: 0.1
  # 任务无关骨干：domain 不进 z_enc；关闭易塌缩的 EMA 余弦 latent
  domain: 0.0
  structure: 0.2
  structure_phase: 0.15
  latent: 0.0
  vicreg: 0.5
  vicreg_token: 0.2
ema_teacher: false
ema_momentum: 0.999
supervised_clustering: false
source_groups:
  ld_radar: [radchar, radar_mod15, cjr_mix]
  tx_comm: [rml2016_*, xidian14, panoradio_hf]
family_quotas:
  tx_comm: 0.55
  ld_radar: 0.45
profiles:
  tiny:
    model_config: configs/model_tiny.yaml
    synthetic: true
    epochs: 1
    token_budget: 256
    steps_per_epoch: 10
    limit_train_batches: 2
    limit_val_batches: 1
    val_batches: 1
    num_workers: 0
    warmup_steps: 1
    learning_rate: 1.0e-3
    require_mamba_kernel: false

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resmamba-signal-model"
version = "0.1.0"
description = "ResMamba RF signal foundation model with multi-space routing and metric pretraining losses."
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "numpy>=1.24",
  "h5py>=3.8",
  "pyyaml>=6.0",
  "einops>=0.7.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["resmamba_signal_model*"]
